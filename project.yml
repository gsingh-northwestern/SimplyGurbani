name: SimplyGurbani
options:
  bundleIdPrefix: com.simplygurbani
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 8
    MARKETING_VERSION: 0.8.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  SimplyGurbani:
    type: application
    platform: iOS
    sources:
      - path: SimplyGurbani
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplygurbani.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Simply Gurbani"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: SimplyGurbani/Info.plist
      properties:
        UIAppFonts:
          - GurbaniAkhar.ttf
          - AnmolLipi-Regular.ttf
          - AnmolLipi-Bold.ttf

  SimplyGurbaniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SimplyGurbaniTests
    dependencies:
      - target: SimplyGurbani
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplygurbani.tests

schemes:
  SimplyGurbani:
    build:
      targets:
        SimplyGurbani: all
        SimplyGurbaniTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SimplyGurbaniTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
